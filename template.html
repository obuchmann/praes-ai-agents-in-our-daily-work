<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* Editor style, light theme. Each slide is 1280x720 and scaled to the window.
   Speaker shows only by colour: --blue and --yellow. No names on slides. */
:root{
  --bg:#ffffff; --ink:#1f2328; --mut:#6e7781; --line:#d0d7de; --paper:#f6f8fa;
  --blue:#4aa3df; --yellow:#e9c23a;
  --kw:#cf222e; --head:#0550ae; --cmt:#1a7f37; --meta:#8250df; --gutter:#8c959f;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b1d21;overflow:hidden}
body{font-family:var(--mono);color:var(--ink)}
.deck{position:fixed;inset:0}
.slide{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;
  transform:scale(var(--k,1));background:var(--bg);overflow:hidden}
.slide[hidden]{display:none}

/* editor chrome: tab bar and gutter */
.tab{position:absolute;left:0;right:0;top:0;height:60px;background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;align-items:flex-end;padding-left:130px}
.tab span{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;
  padding:10px 22px 11px;font-size:20px;margin-bottom:-1px}
.gutter{position:absolute;left:0;top:60px;bottom:0;width:115px;background:var(--paper);border-right:1px solid var(--line)}

/* the file content */
.code{position:absolute;left:115px;top:96px;right:60px;bottom:96px;counter-reset:ln;display:flex;gap:44px}
.lines{flex:1;min-width:0}
.l{position:relative;min-height:44px;font-size:28px;line-height:44px;white-space:pre-wrap;padding-left:38px;counter-increment:ln}
.l::before{content:counter(ln);position:absolute;left:-115px;width:84px;text-align:right;color:var(--gutter);font-size:22px;font-weight:400}
.l .k{color:var(--kw)}
.l.meta{color:var(--meta);font-size:22px}
.l.h1{color:var(--head);font-size:62px;line-height:84px;min-height:84px;font-weight:700}
.l.h1::before{line-height:84px}
.l.h2{color:var(--head);font-weight:700}
.l.sub{color:var(--mut)}
.l code{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.slide.title .l.h1{font-size:84px;line-height:110px;min-height:110px;margin-top:30px}
.slide.title .l.h1::before{line-height:110px}

/* side notes (branches from the diagram) */
.side{width:340px;flex:none;display:flex;flex-direction:column;gap:14px;padding-top:150px}
.sidel{font-size:20px;color:var(--mut);font-weight:700}
.note{border-left:4px solid var(--cmt);color:var(--cmt);font-size:23px;line-height:1.3;padding:8px 14px}
.note::before{content:"// "}

.blue{background:var(--blue)} .yellow{background:var(--yellow)}

/* two-track strip: Show on top, Tell below */
.track{position:absolute;left:54px;right:26px;bottom:14px;height:44px;display:grid;
  grid-template-rows:1fr 1fr;column-gap:6px;row-gap:6px;z-index:4}
.track b{font-size:15px;line-height:19px;color:var(--mut)}
.track i{border-radius:3px;opacity:.4}
.track i.empty{opacity:0}
.track i.both{background:linear-gradient(90deg,var(--yellow) 50%,var(--blue) 50%)}
.track i.live{background:transparent!important;border:2.5px dashed var(--mut)}
.track i.live.blue{border-color:var(--blue)} .track i.live.yellow{border-color:var(--yellow)}
.track i.live.both{border-color:var(--blue) var(--yellow) var(--yellow) var(--blue)}
.track i.past{opacity:1}
.track i.cur{opacity:1;outline:3.5px solid var(--ink);outline-offset:2px}

.notes{display:none}

/* presenter view: the same file, opened with #notes */
body.presenter{overflow:auto;background:#fff;font-family:system-ui,sans-serif}
body.presenter .deck{display:none}
.pv{display:none;padding:24px 28px;max-width:900px}
body.presenter .pv{display:block}
.pv .top{display:flex;gap:20px;align-items:baseline;font-size:20px;color:var(--mut)}
.pv .clock{font:700 44px var(--mono);color:var(--ink)}
.pv h1{font-size:36px;margin:18px 0 6px}
.pv .body{font-size:26px;line-height:1.45}
.pv .body ul{padding-left:26px}
.pv .next{margin-top:26px;font-size:20px;color:var(--mut)}
.pv .dot{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.pv .live{font-weight:700}
.pv .keys{margin-top:30px;font-size:16px;color:var(--mut)}

/* PDF: one slide per page */
@page{size:1280px 720px;margin:0}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  .deck{position:static}
  .slide,.slide[hidden]{display:block;position:relative;left:0;top:0;margin:0;transform:none;break-after:page;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pv{display:none!important}
}
</style>
</head>
<body>
<main class="deck" aria-live="polite">
{{SLIDES}}
</main>
<div class="pv" aria-live="polite">
  <div class="top"><span class="clock" id="clock">0:00</span><span id="count"></span></div>
  <h1 id="ptitle"></h1>
  <div class="body" id="pbody"></div>
  <div class="next" id="pnext"></div>
  <div class="keys">→ / ← move the slides. T resets the clock.</div>
</div>
<script>
(() => {
  const S = [...document.querySelectorAll(".slide")];
  const presenter = location.hash === "#notes";
  let i = 0, notesWin = null, t0 = Date.now();

  function scale() {
    const k = Math.min(innerWidth / 1280, innerHeight / 720);
    document.documentElement.style.setProperty("--k", k.toFixed(4));
  }
  function clamp(n) { return Math.max(0, Math.min(S.length - 1, n)); }

  function show(n) {
    i = clamp(n);
    S.forEach((s, k) => { s.hidden = k !== i; });
    history.replaceState(null, "", "#" + (i + 1));
    if (notesWin && !notesWin.closed) notesWin.postMessage({ slide: i }, "*");
  }

  function renderNotes(n) {
    i = clamp(n);
    const s = S[i], next = S[i + 1];
    document.getElementById("count").textContent = (i + 1) + " / " + S.length;
    document.getElementById("ptitle").textContent = s.dataset.title;
    document.getElementById("pbody").innerHTML = s.querySelector(".notes").innerHTML;
    document.getElementById("pnext").textContent = next ? "Next slide: " + next.dataset.title : "Last slide.";
  }

  function tick() {
    const sec = Math.floor((Date.now() - t0) / 1000);
    document.getElementById("clock").textContent = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
  }

  function step(key) {
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(key)) return 1;
    if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(key)) return -1;
    return 0;
  }

  if (presenter) {
    document.body.classList.add("presenter");
    renderNotes(0);
    setInterval(tick, 1000);
    addEventListener("message", e => { if (e.data && typeof e.data.slide === "number") renderNotes(e.data.slide); });
    addEventListener("keydown", e => {
      const d = step(e.key);
      if (d && opener) { opener.postMessage({ go: d }, "*"); e.preventDefault(); }
      if (e.key === "t" || e.key === "T") { t0 = Date.now(); tick(); }
    });
    if (opener) opener.postMessage({ hello: true }, "*");
    return;
  }

  scale();
  addEventListener("resize", scale);
  show((parseInt(location.hash.slice(1), 10) || 1) - 1);
  addEventListener("message", e => {
    if (!e.data) return;
    if (e.data.go) show(i + e.data.go);
    if (e.data.hello && notesWin) notesWin.postMessage({ slide: i }, "*");
  });
  addEventListener("keydown", e => {
    const d = step(e.key);
    if (d) { show(i + d); e.preventDefault(); return; }
    if (e.key === "Home") show(0);
    else if (e.key === "End") show(S.length - 1);
    else if (e.key === "n" || e.key === "N") notesWin = open(location.href.split("#")[0] + "#notes", "tell-show-notes", "width=900,height=700");
    else if (e.key === "f" || e.key === "F") {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
    }
  });
})();
</script>
</body>
</html>
